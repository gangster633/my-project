name: 키워드 수집

on:
  # 매일 자동 수집은 잠시 멈춤. 다시 켜려면 아래 두 줄의 맨 앞 "# "을 지우세요.
  # schedule:
  #   - cron: "17 20 * * *"   # 매일 한국시간 새벽 5시 17분
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect-keywords
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 키워드 수집
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python3 collector/collect.py
      - name: 사이트 빌드
        run: python3 build.py
      - name: 결과 커밋
        run: |
          git config user.name "keyword-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/static/data data docs
          git diff --cached --quiet || git commit -m "키워드 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git push

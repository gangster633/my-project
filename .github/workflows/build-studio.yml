name: AI 영상 공방 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - "studio/**"
      - ".github/workflows/build-studio.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 ffmpeg
          pip install pillow anthropic
      - name: 모듈 점검
        run: |
          cd studio
          python -c "import studio, pipeline, render, ai, prompts, textutil; print('ok')"
          python -c "import textutil as t; assert t.read_numbers('86주') == '팔십육 주'; assert t.read_numbers('3명') == '세 명'; assert t.read_numbers('1만 원') == '만 원'"
      - name: 윈도우 zip 만들기
        run: python studio/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI영상공방-windows
          path: studio/dist/*.zip
          retention-days: 30

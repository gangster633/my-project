<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 영상 공방</title>
<style>
:root {
  --bg: #0e1116; --panel: #161a22; --panel2: #1c212b; --line: #2a303c; --text: #e7eaf0; --muted: #96a0b2; --dim: #6b7486;
  --accent: #22c3e6; --accent-ink: #04222b; --accent-soft: #0f2f39; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --side: #0a0d12;
}
:root[data-theme="light"] {
  --bg: #f3f5f8; --panel: #fff; --panel2: #f6f7fa; --line: #dfe3ea; --text: #1a2030; --muted: #5b6475; --dim: #8a93a3;
  --accent: #0891b2; --accent-ink: #fff; --accent-soft: #e0f5fa; --side: #121722;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: flex; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
textarea { resize: vertical; }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); }
input[type=range] { padding: 0; accent-color: var(--accent); }
input[type=color] { padding: 2px; height: 36px; width: 56px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; white-space: nowrap; }
button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
button.link { background: none; color: var(--accent); padding: 4px 6px; font-weight: 600; }
button.danger { background: none; color: var(--bad); border: 1px solid var(--line); }
button.sm { padding: 5px 10px; font-size: 12.5px; }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--accent); }
.dim { color: var(--muted); } .tiny { font-size: 12px; } .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { align-items: flex-end; }
.grow { flex: 1; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 1000px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

aside { width: 236px; flex: none; background: var(--side); color: #c9d0db; display: flex; flex-direction: column; padding: 14px 12px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px 14px; cursor: pointer; }
.brand .ico { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #22c3e6, #8b5cf6); display: grid; place-items: center; font-weight: 900; color: #fff; }
.brand b { display: block; color: #fff; font-size: 15px; } .brand small { color: #7b8597; font-size: 11.5px; }
.nav button { display: flex; width: 100%; background: none; color: #c9d0db; font-weight: 500; padding: 8px 10px; border-radius: 8px; text-align: left; gap: 8px; }
.nav button[aria-current] { background: #1f2633; color: #fff; }
.proj-name { margin: 14px 6px 6px; font-size: 12px; color: #7b8597; } .proj-name b { display: block; color: #fff; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps { list-style: none; margin: 4px 0 0; padding: 0; flex: 1; overflow: auto; }
.steps li { position: relative; }
.steps li::before { content: ""; position: absolute; left: 19px; top: 30px; bottom: -6px; width: 2px; background: #252c38; }
.steps li:last-child::before { display: none; }
.steps button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; color: #8d96a8; font-weight: 500; padding: 7px 8px; border-radius: 10px; text-align: left; }
.steps button .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #39414f; display: grid; place-items: center; font-size: 11px; flex: none; background: var(--side); position: relative; z-index: 1; }
.steps button.done .dot { background: var(--ok); border-color: var(--ok); color: #05261a; }
.steps button[aria-current] { background: #13303a; color: #fff; outline: 1px solid #1f6f82; }
.steps button[aria-current] .dot { border-color: var(--accent); }
.steps small { display: block; font-size: 10.5px; letter-spacing: .06em; color: #5f6878; }
.steps .sub { font-size: 11px; color: #6b7486; }
.side-foot { border-top: 1px solid #1f2633; padding-top: 10px; display: flex; gap: 6px; }
.side-foot button { flex: 1; background: none; border: 1px solid #252c38; color: #8d96a8; font-weight: 500; padding: 6px; font-size: 12px; }

main { flex: 1; min-width: 0; overflow: auto; padding: 18px 28px 80px; }
.crumb { font-size: 12px; color: var(--muted); }
h1 { font-size: 23px; margin: 2px 0 4px; } h2 { font-size: 16px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 0 0 8px; }
.lead { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.panel.tight { padding: 12px 14px; }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 8px 0; }
.notice { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: #3a2a0a; color: #fde68a; }
:root[data-theme="light"] .notice { background: #fff6dd; color: #8a5a00; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.pill.ok { color: var(--ok); border-color: #1d5c47; } .pill.acc { color: var(--accent); border-color: #1f6f82; }
.next { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }

/* 진행 표시 */
#jobbar { position: fixed; right: 18px; bottom: 18px; width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 12px 32px #0008; z-index: 50; }
#jobbar[hidden] { display: none; }
.bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #8b5cf6); width: 0; transition: width .4s; }
.bar.ind i { width: 35% !important; animation: slide 1.3s infinite ease-in-out; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

/* 카드 목록 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; color: var(--text); font-weight: 400; white-space: normal; }
.card:hover { border-color: #3a4456; }
.card .th { aspect-ratio: 16/9; background: var(--panel2) center/cover no-repeat; display: grid; place-items: center; color: var(--dim); font-size: 12px; }
.card .bd { padding: 10px 12px; } .card b { display: block; }
.vc { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel); cursor: pointer; text-align: left; color: var(--text); font-weight: 400; white-space: normal; position: relative; }
.vc[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.vc b { display: block; } .vc .star { position: absolute; right: 8px; top: 6px; background: none; color: var(--dim); padding: 2px 4px; font-size: 15px; }
.vc .star.on { color: var(--warn); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; max-height: 420px; overflow: auto; padding: 2px; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); font-weight: 600; padding: 5px 12px; font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.style-card .th { aspect-ratio: 16/9; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px #0009; background-size: cover; background-position: center; }
.sents { max-height: 300px; overflow: auto; font-size: 13px; }
.sents div { padding: 4px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 10px; }
.sents div:hover { background: var(--panel2); }
.sents div.on { background: var(--accent-soft); }
.sents .t { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; width: 46px; }
.check { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.check:last-child { border: 0; }

/* 장면 */
.scene { display: grid; grid-template-columns: 210px 1fr; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; background: var(--panel); }
.scene .media { aspect-ratio: 16/9; border-radius: 8px; background: var(--panel2) center/cover no-repeat; display: grid; place-items: center; color: var(--dim); font-size: 12px; position: relative; overflow: hidden; border: 1px dashed var(--line); }
.scene .media video { width: 100%; height: 100%; object-fit: cover; }
.scene .media.drag { outline: 2px dashed var(--accent); }
.scene .media .badge { position: absolute; left: 6px; top: 6px; }
.scene textarea { font-size: 13px; }
.scene .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.scene .meta select { width: auto; padding: 4px 6px; font-size: 12.5px; }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.icard { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.icard .media { aspect-ratio: 16/9; background: var(--panel2) center/cover no-repeat; display: grid; place-items: center; color: var(--dim); font-size: 12px; position: relative; }
.icard .media video { width: 100%; height: 100%; object-fit: cover; }
.icard .media.drag { outline: 3px dashed var(--accent); outline-offset: -3px; }
.icard .bd { padding: 8px 10px; font-size: 12.5px; }
.icard .bd p { margin: 0 0 6px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.icard .num { position: absolute; left: 6px; top: 6px; background: #000a; color: #fff; padding: 1px 7px; border-radius: 99px; font-size: 11px; }

/* 자막 미리보기 */
.preview { position: relative; aspect-ratio: 16/9; background: #222 center/cover no-repeat; border-radius: 10px; overflow: hidden; user-select: none; container-type: inline-size; }
.preview.v { aspect-ratio: 9/16; max-width: 300px; }
.preview .sub { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-weight: 700; padding: .1em .45em; line-height: 1.35; }
.preview .logo { position: absolute; cursor: move; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { background: #111; border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; font-weight: 800; -webkit-text-stroke: 0 !important; text-shadow: 0 1px 2px #000; }
video.player { width: 100%; border-radius: 12px; background: #000; max-height: 70vh; }
.copybox { position: relative; }
.copybox textarea { padding-right: 70px; }
.copybox button { position: absolute; right: 8px; top: 8px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(760px, 92vw); }
dialog::backdrop { background: #000a; }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--panel2); padding: 1px 6px; border-radius: 4px; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
</style>
</head>
<body>
<aside>
  <div class="brand" onclick="go('home')"><div class="ico">공</div><div><b>AI 영상 공방</b><small>기사 한 줄로 유튜브 영상까지 · v__VERSION__</small></div></div>
  <div class="nav">
    <button data-nav="home" onclick="go('home')">🏠 모든 프로젝트</button>
    <button data-nav="settings" onclick="go('settings')">⚙️ 설정 · API 키</button>
    <button data-nav="guide" onclick="go('guide')">📘 사용법</button>
  </div>
  <div id="projnav" hidden>
    <div class="proj-name">지금 프로젝트<b id="pname"></b></div>
    <ul class="steps" id="steps"></ul>
  </div>
  <div style="flex:1" id="spacer"></div>
  <div class="side-foot">
    <button onclick="toggleTheme()">🌓 화면</button>
    <button onclick="quitApp()">⏻ 종료</button>
  </div>
</aside>
<main id="main"></main>
<div id="jobbar" hidden>
  <div class="row"><b id="jobtitle" class="grow">작업 중</b><button class="sm danger" id="jobcancel" onclick="cancelJob()">취소</button></div>
  <div class="bar" id="jobbarbar"><i id="jobfill"></i></div>
  <div class="tiny dim" id="jobmsg"></div>
</div>
<dialog id="dlg"></dialog>

<script>
const TOKEN = "__TOKEN__";
const STEPS = [
  ["script", "SCRIPT", "대본"], ["voice", "VOICE", "음성"], ["style", "STYLE", "화풍 · 캐릭터"], ["storyboard", "STORYBOARD", "스토리보드"],
  ["image", "IMAGE", "이미지"], ["video", "VIDEO", "영상"], ["export", "EXPORT", "완성 · 업로드 준비"],
];
const MOTIONS = {zoom_in: "줌 인", zoom_out: "줌 아웃", pan_left: "← 이동", pan_right: "→ 이동", pan_up: "↑ 이동", pan_down: "↓ 이동", still: "정지"};
const TRANS = {cut: "컷", fade: "페이드", dissolve: "디졸브", fadeblack: "검은 화면 경유", slideleft: "밀기 ←", slideright: "밀기 →", smoothleft: "부드럽게 ←", wipeleft: "닦아내기", circleopen: "원형 열기", zoomin: "줌 전환"};
const SUB_PRESETS = [
  {name: "정보 신뢰", css: "background:#000c;color:#fff", v: {color: "#ffffff", accent: "#ffd400", box: true, box_color: "#000000", box_opacity: 0.65, bold: true, size: 17, position: "bottom"}},
  {name: "노랑 강조", css: "color:#ffe400;-webkit-text-stroke:1px #000", v: {color: "#ffe400", accent: "#ffffff", box: false, outline: 2.2, outline_color: "#000000", bold: true, size: 19, position: "bottom"}},
  {name: "감성 브이로그", css: "color:#fff;-webkit-text-stroke:.5px #333", v: {color: "#ffffff", accent: "#ffd6e7", box: false, outline: 1.0, outline_color: "#333333", bold: false, size: 16, position: "bottom"}},
  {name: "공포 몰입", css: "color:#ff3b3b;background:#000", v: {color: "#ff4d4d", accent: "#ffffff", box: true, box_color: "#000000", box_opacity: 0.85, bold: true, size: 17, position: "bottom"}},
  {name: "예능 빨간 띠", css: "background:#e11d48;color:#fff", v: {color: "#ffffff", accent: "#ffe400", box: true, box_color: "#e11d48", box_opacity: 0.95, bold: true, size: 18, position: "bottom"}},
  {name: "시니어 큰 글씨", css: "background:#000;color:#fff;font-size:15px", v: {color: "#ffffff", accent: "#7dd3fc", box: true, box_color: "#000000", box_opacity: 0.8, bold: true, size: 22, position: "bottom", max_chars: 18}},
  {name: "이슈 채널", css: "color:#fff;-webkit-text-stroke:1px #000", v: {color: "#ffffff", accent: "#ffe066", box: false, outline: 2.6, outline_color: "#000000", bold: true, size: 20, position: "bottom", margin: 0.07}},
  {name: "미니멀", css: "color:#fff;text-shadow:0 1px 3px #000", v: {color: "#ffffff", accent: "#ffffff", box: false, outline: 0.6, outline_color: "#000000", bold: false, size: 15, position: "bottom", highlight_numbers: false}},
  {name: "가운데 크게", css: "color:#fff;-webkit-text-stroke:1px #000;background:#0006", v: {color: "#ffffff", accent: "#ffe400", box: false, outline: 2.5, outline_color: "#000000", bold: true, size: 22, position: "center"}},
];
let state = {view: "home", pid: null, p: null, info: null, cfg: null, voices: null, voiceTab: "ko", audioEl: null, jobWatch: null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = t => { t = Math.max(0, Math.round(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const fileUrl = (rel, dl) => rel ? `/files/${state.pid}/${encodeURI(rel)}?token=${TOKEN}${dl ? "&download=" + encodeURIComponent(dl) : ""}&v=${Date.now() % 1e7}` : "";
const stripCount = s => (s || "").split("\n").filter(l => !/^\s*#/.test(l)).join("").replace(/\s/g, "").length;

async function api(path, body) {
  const opt = {headers: {"X-Token": TOKEN}};
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("오류 " + r.status));
  return j;
}
async function upload(file, params) {
  const q = new URLSearchParams(params).toString();
  const r = await fetch(`/api/upload?${q}`, {method: "POST", headers: {"X-Token": TOKEN, "X-Filename": encodeURIComponent(file.name)}, body: file});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "올리기 실패");
  return j;
}
function toast(msg, bad) {
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = `position:fixed;left:50%;top:18px;transform:translateX(-50%);background:${bad ? "#7f1d1d" : "#0f3b46"};color:#fff;padding:10px 18px;border-radius:10px;z-index:99;max-width:80vw;box-shadow:0 8px 24px #0007`;
  // 창(dialog)이 열려 있으면 그 안에 띄운다. 바깥에 띄우면 창 뒤에 가려 안 보인다.
  (document.querySelector("dialog[open]") || document.body).appendChild(d);
  setTimeout(() => d.remove(), bad ? 6000 : 2600);
}
const fail = e => toast(e.message || String(e), true);
// 클립보드: 버튼을 누른 그 순간에 복사를 시작해야 브라우저가 막지 않는다.
function execCopy(text) { const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} t.remove(); return ok; }
function tryCopy(text) { return (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => true, () => execCopy(text)); }
function copy(text) { return tryCopy(text).then(ok => { toast(ok ? "복사했어요" : "복사가 막혔어요. 글을 직접 선택해 Ctrl+C 로 복사해 주세요", !ok); return ok; }); }
// 서버에서 받아 올 글(Promise)을 누르는 순간 복사 예약한다 (ClipboardItem 이 Promise 를 받는다)
function copyLater(textP) {
  let done;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const item = new ClipboardItem({"text/plain": textP.then(t => new Blob([t], {type: "text/plain"}))});
      done = navigator.clipboard.write([item]).then(() => true, () => textP.then(tryCopy));
    }
  } catch (e) { done = null; }
  return (done || textP.then(tryCopy)).catch(() => false);
}
// 서버 글을 가져와 복사하고 결과를 알린다 (단순 복사 버튼용)
function copyFrom(textP) {
  const c = copyLater(textP);
  return Promise.all([textP, c]).then(([t, ok]) => { toast(ok ? "복사했어요" : "복사가 막혔어요. 다시 눌러 주세요", !ok); return t; }, fail);
}
const promptOf = step => api(`/api/prompt?id=${state.pid}&step=${encodeURIComponent(step)}`).then(r => r.prompt);
function toggleTheme() { const r = document.documentElement; const n = r.dataset.theme === "light" ? "dark" : "light"; r.dataset.theme = n; try { localStorage.vwTheme = n; } catch (e) {} }
try { if (localStorage.vwTheme) document.documentElement.dataset.theme = localStorage.vwTheme; } catch (e) {}
async function quitApp() { if (confirm("프로그램을 종료할까요?")) { await api("/api/quit", {}).catch(() => {}); document.body.innerHTML = "<div class='empty' style='margin:auto'>종료했어요. 이 탭을 닫아도 됩니다.</div>"; } }
setInterval(() => api("/api/ping").catch(() => {}), 30000);

// ---------------- 이동 ----------------
async function go(view, pid) {
  if (pid) state.pid = pid;
  state.view = view;
  document.querySelectorAll("[data-nav]").forEach(b => b.toggleAttribute("aria-current", b.dataset.nav === view));
  if (["home", "settings", "guide"].includes(view)) { $("#projnav").hidden = true; $("#spacer").hidden = false; }
  if (!state.cfg) state.cfg = await api("/api/config");
  if (view === "home") return viewHome();
  if (view === "settings") return viewSettings();
  if (view === "guide") return viewGuide();
  await loadProject();
  render();
}
async function loadProject() {
  const r = await api("/api/project?id=" + state.pid);

}
function stepDone(k) {
  const p = state.p;
  const sb = p.storyboard;
  return {script: !!p.script, voice: !!p.audio, style: !!p.style.chosen, storyboard: !!sb,
    image: !!sb && sb.scenes.every(s => s.image || s.video), video: !!p.outputs.video, export: !!(p.meta && p.outputs.thumbs)}[k];
}
function stepSub(k) {
  const p = state.p;
  if (k === "script" && p.script) return stripCount(p.script).toLocaleString() + "자";
  if (k === "voice" && p.audio) return fmt(p.audio.total) + " · " + (p.audio.voice.name || p.audio.voice.id);
  if (k === "style" && p.style.chosen) return (state.cfg.styles.find(s => s.id === p.style.id) || {}).name || "직접 입력";
  if (k === "storyboard" && p.storyboard) return p.storyboard.scenes.length + "컷";
  if (k === "image" && p.storyboard) return p.storyboard.scenes.filter(s => s.image || s.video).length + "/" + p.storyboard.scenes.length;
  if (k === "video" && p.outputs.video) return fmt(p.outputs.video.seconds);
  return "";
}
function drawSteps() {
  $("#steps").innerHTML = STEPS.map(([k, en, ko], i) => `<li><button class="${stepDone(k) ? "done" : ""}" ${state.view === k ? "aria-current" : ""} onclick="go('${k}')">
    <span class="dot">${stepDone(k) ? "✓" : i + 1}</span><span><small>${en}</small>${ko} <span class="sub">${esc(stepSub(k))}</span></span></button></li>`).join("");
}
function render() {
  drawSteps();
  const v = {script: viewScript, voice: viewVoice, style: viewStyle, storyboard: viewStoryboard, image: viewImage, video: viewVideo, export: viewExport}[state.view];
  if (v) v();
}
async function save(fields, quiet) {

function header(k, desc) {

  return errBox + `<div class="crumb"><a href="#" onclick="go('home');return false">모든 프로젝트</a> / ${esc(state.p.name)} · ${i + 1}/7</div><h1>${STEPS[i][2]}</h1><p class="lead">${desc}</p>`;
}
function nextBtn(k) {

}
const manual = () => (state.cfg.settings.text_provider || "claude") === "manual";

// AI 단계 버튼: API 모드는 실행, 직접 붙여넣기 모드는 지시문 복사 → 답 붙여넣기
function aiButton(step, label, opts, cls) {
  const o = esc(JSON.stringify(opts || {}));
  if (manual()) return `<button class="${cls || ""}" onclick='manualStep("${step}", ${o})'>${label} (지시문 복사)</button>`;
  return `<button class="${cls || ""}" onclick='runStep("${step.split(":")[0]}", ${o})'>${label}</button>`;
}
function manualStep(step, opts) {
  if (step.startsWith("translate")) step = "translate:" + opts.lang;
  // 대본 화면이면 입력값을 먼저 저장한 뒤 지시문을 만든다. 복사는 누른 순간 예약해 둔다.
  const pre = state.view === "script" && $("#s_topic") ? saveScriptForm() : Promise.resolve();
  const promptP = pre.then(() => promptOf(step));
  const copied = copyLater(promptP);
  return Promise.all([promptP, copied]).then(([prompt, ok]) => prompt && openPasteDialog(step, prompt, ok), fail);
}
function openPasteDialog(step, prompt, ok) {
  const d = $("#dlg");
  d.innerHTML = `<h2>직접 붙여넣기</h2>
    ${ok ? "" : `<div class="notice">브라우저가 자동 복사를 막았어요. 아래 <b>[지시문 복사]</b>를 한 번 더 눌러 주세요.</div>`}
    <ol class="dim" style="margin:0 0 10px;padding-left:18px"><li>${ok ? "지시문을 복사했어요." : "지시문을 복사한 뒤"} Claude.ai, ChatGPT, Gemini 같은 AI 채팅에 붙여 넣으세요.</li>
    <li>AI의 <b>답</b>을 전부 복사해 아래에 붙여 넣고 [넣기]를 누르세요. 지시문이 아니라 답이에요.</li></ol>
    <details ${ok ? "" : "open"}><summary class="dim tiny">지시문 보기</summary><textarea rows="6" readonly>${esc(prompt)}</textarea></details>
    <button class="sm ${ok ? "ghost" : ""}" id="recopy">지시문 ${ok ? "다시 " : ""}복사</button>
    <textarea id="pasted" rows="12" placeholder="AI 답을 여기에 붙여 넣기" style="margin-top:10px"></textarea>
    <div id="pasteerr" class="notice" hidden style="margin-top:8px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="ghost" onclick="dlg.close()">닫기</button><button id="pastebtn">넣기</button></div>`;
  d.showModal();
  $("#recopy").onclick = () => copy(prompt);
  $("#pastebtn").onclick = async () => {
    const btn = $("#pastebtn"), err = $("#pasteerr");
    btn.disabled = true; btn.textContent = "넣는 중…"; err.hidden = true;
    try {
      const r = await api("/api/import", {id: state.pid, step, text: $("#pasted").value});
      d.close(); await loadProject(); render(); toast(r.summary || "넣었어요");
    } catch (e) {
      err.textContent = "넣지 못했어요: " + (e.message || e); err.hidden = false;  // 창 안에 바로 보이게
    } finally { btn.disabled = false; btn.textContent = "넣기"; }
  };
}
async function runStep(step, opts) {
  try { await api("/api/run", {id: state.pid, step, opts: opts || {}}); watchJob(); } catch (e) { fail(e); }
}
function watchJob() {
  if (state.jobWatch) return;
  $("#jobbar").hidden = false;
  const tick = async () => {
    let j;
    try { j = await api("/api/job"); } catch (e) { state.jobWatch = setTimeout(tick, 2000); return; }
    $("#jobtitle").textContent = j.running ? (j.message || "작업 중").replace(/\s*\(.*$/, "") : (j.error ? "실패" : j.message);
    $("#jobmsg").textContent = j.error || j.message;
    $("#jobmsg").className = "tiny " + (j.error ? "bad" : "dim");
    const pct = j.total ? Math.round(j.done / j.total * 100) : 0;
    $("#jobbarbar").classList.toggle("ind", j.running && !j.total);
    $("#jobfill").style.width = (j.running ? pct : 100) + "%";
    $("#jobcancel").hidden = !j.running;
    if (j.running) { state.jobWatch = setTimeout(tick, 900); return; }
    state.jobWatch = null;
    if (j.error) toast(j.error, true); else toast(j.message === "완료" ? "완료했어요" : j.message);
    setTimeout(() => { if (!state.jobWatch) $("#jobbar").hidden = true; }, j.error ? 12000 : 2500);
    if (j.step === "style_examples") state.cfg = await api("/api/config");
    if (state.pid === j.pid && !["home", "settings", "guide"].includes(state.view)) { await loadProject(); render(); }
    else if (state.view === "home") viewHome();
  };
  tick();
}

// AI 단계를 실행하기 전에 입력값을 저장한다
const _runStep = runStep;
runStep = async (step, opts) => { if (state.view === "script" && $("#s_topic")) await saveScriptForm(); return _runStep(step, opts); };
async function saveScript(quiet) { await save({script: $("#s_script").value}, quiet); await loadProject(); if (!quiet) render(); }
async function saveTranslation(quiet) { const t = {...state.p.translations, [state.scriptLang]: $("#s_script").value}; await save({translations: t}, quiet); }
async function fetchUrl() {
  const url = $("#s_url").value.trim();
  if (!url) return toast("링크를 넣어 주세요", true);
  try { const a = await api("/api/fetch_url", {url}); $("#s_src").value = (a.title ? a.title + "\n\n" : "") + a.text; $("#s_src").closest("details").open = true; if (!$("#s_topic").value) $("#s_topic").value = a.title; await saveScriptForm(); toast(`본문 ${a.text.length.toLocaleString()}자를 가져왔어요`); } catch (e) { fail(e); }
}
async function applyFix(i) {
  const f = state.p.factcheck[i];
  if (!state.p.script.includes(f.quote)) return toast("대본에서 그 문장을 찾지 못했어요. 직접 고쳐 주세요.", true);
  const fc = state.p.factcheck.filter((_, k) => k !== i);
  await save({script: state.p.script.replace(f.quote, f.fix), factcheck: fc});
  await loadProject(); render();
}

  bind("#v_speed", "#spv", x => (+x).toFixed(2) + "배"); bind("#v_gap", "#gv", x => x + "초"); bind("#v_pgap", "#pgv", x => x + "초");

  document.querySelectorAll("#main input, #main textarea").forEach(el => el.addEventListener("change", saveVoiceForm));
  if (p.audio) {
    const a = $("#narr");
    a.ontimeupdate = () => { const t = a.currentTime; document.querySelectorAll("#sents div").forEach(d => d.classList.toggle("on", t >= +d.dataset.t && t < +d.dataset.e)); };

function voiceForm() {
  return {...state.p.voice, speed: +$("#v_speed").value, style: $("#v_style").value, numbers: $("#v_num").checked, auto_pause: $("#v_auto").checked, dictionary: $("#v_dict").value,
    gap: +$("#v_gap").value, para_gap: +$("#v_pgap").value, compress: $("#v_comp").checked, min_silence: +$("#v_min").value, keep_silence: +$("#v_keep").value, silence_db: +$("#v_db").value};
}
async function saveVoiceForm() { await save({voice: voiceForm()}, true); }
const favs = () => { try { return JSON.parse(localStorage.vwFav || "[]"); } catch (e) { return []; } };
function toggleFav(key, ev) { ev.stopPropagation(); let f = favs(); f = f.includes(key) ? f.filter(x => x !== key) : [...f, key]; try { localStorage.vwFav = JSON.stringify(f); } catch (e) {} drawVoices(); }
function drawVoices() {
  const vs = state.voices || [], f = favs();
  const groups = {all: "전체", fav: "★ 즐겨찾기", free: "무료", sapi: "윈도우 기본", azure: "Azure (무료 등급)", gemini: "Gemini", openai: "OpenAI", elevenlabs: "ElevenLabs"};
  const have = new Set(vs.map(v => v.provider));
  const tab = state.voiceTab = (state.voiceTab in groups ? state.voiceTab : "all");
  $("#vtabs").innerHTML = Object.entries(groups).filter(([k]) => ["all", "fav", "free"].includes(k) || have.has(k)).map(([k, n]) => `<button aria-selected="${k === tab}" onclick="state.voiceTab='${k}';drawVoices()">${n}</button>`).join("");
  let list = vs.filter(v => tab === "all" || (tab === "fav" ? f.includes(v.provider + ":" + v.id) : tab === "free" ? v.free : v.provider === tab));
  list.sort((a, b) => f.includes(b.provider + ":" + b.id) - f.includes(a.provider + ":" + a.id));
  const cur = state.p.voice;
  $("#vgrid").innerHTML = list.length ? list.map(v => { const key = v.provider + ":" + v.id; return `<div class="vc" aria-selected="${cur.provider === v.provider && cur.id === v.id}" onclick='pickVoice(${esc(JSON.stringify(v))})'>
      <button class="star ${f.includes(key) ? "on" : ""}" onclick="toggleFav('${esc(key)}', event)">★</button><b>${esc(v.name)}</b><div class="tiny dim">${esc(v.desc)}</div>
      ${v.provider !== "silent" && v.id ? `<button class="link sm" style="padding-left:0" onclick='event.stopPropagation();previewVoice(${esc(JSON.stringify(v))}, this)'>▶ 미리듣기</button>` : ""}</div>`; }).join("")
    : `<div class="dim">이 목록에 목소리가 없어요. 설정에서 Gemini·OpenAI·ElevenLabs 키를 넣으면 목소리가 늘어나요.</div>`;
  $("#v_sel").innerHTML = cur.provider ? `선택한 목소리: <b>${esc(cur.name || cur.id)}</b> <span class="dim">(${esc(cur.provider)})</span>` : "위에서 목소리를 골라 주세요.";
  ["ja", "en"].forEach(l => { const s = $("#ml_" + l); if (!s) return; const prev = (state.p.audio_lang[l] || {}).voice || {}; s.innerHTML = vs.filter(v => v.provider !== "sapi" || v.desc.includes(l === "ja" ? "ja-" : "en-")).map(v => `<option value='${esc(JSON.stringify(v))}' ${prev.id === v.id ? "selected" : ""}>${esc(v.name)} · ${esc(v.provider)}</option>`).join(""); });
}
async function pickVoice(v) { state.p.voice = {...voiceForm(), provider: v.provider, id: v.id, name: v.name}; await save({voice: state.p.voice}, true); drawVoices(); }
let previewAudio;
async function previewVoice(v, btn) {
  btn.textContent = "만드는 중…";
  try {
    const f = voiceForm();
    const r = await api("/api/voice_preview", {provider: v.provider, id: v.id, speed: f.speed, style: f.style, dictionary: f.dictionary, auto_pause: f.auto_pause,
      text: (state.p.audio ? null : null) || (state.p.script ? state.p.script.split(/\n/).find(l => l.trim() && !l.startsWith("#")).slice(0, 90) : "")});
    previewAudio?.pause(); previewAudio = new Audio(r.url + "?token=" + TOKEN); previewAudio.play();
  } catch (e) { fail(e); }
  btn.textContent = "▶ 미리듣기";
}
function seek(t) { const a = $("#narr"); a.currentTime = t; a.play(); }
async function makeVoice() { if (!state.p.voice.provider) return toast("목소리를 먼저 골라 주세요", true); await saveVoiceForm(); runStep("voice", {}); }
async function makeVoiceLang(l) { const v = JSON.parse($("#ml_" + l).value); runStep("voice", {lang: l, voice: {...voiceForm(), provider: v.provider, id: v.id, name: v.name, numbers: false, dictionary: ""}}); }

const STYLE_BG = {cinematic: "#3d5a6c,#c49a6c", pixar3d: "#f59e0b,#3b82f6", miniature: "#86efac,#f9a8d4", cyberpunk: "#7c3aed,#06b6d4", webtoon: "#60a5fa,#fde68a", joseon: "#a8a29e,#57534e",
  ghibli_like: "#4ade80,#93c5fd", retro_anime: "#f9a8d4,#a78bfa", infographic: "#1e3a8a,#f97316", news_photo: "#64748b,#334155", flat: "#34d399,#fbbf24", whiteboard: "#f8fafc,#94a3b8",
  dark_horror: "#111827,#7f1d1d", oil: "#92400e,#1e3a8a", senior_warm: "#fed7aa,#fecdd3", pixel: "#22c55e,#6366f1",

function viewStyle() {

  const missing = state.cfg.styles.filter(s => !ex[s.id]).map(s => s.id);
  const canAuto = state.cfg.keys.gemini_key || state.cfg.keys.openai_key;
  const cnt = n => Math.max(3, Math.round(secs / n));
  $("#main").innerHTML = header("style", "영상 전체에 쓸 화풍과 반복해 나올 인물을 정해요. 예시 그림은 모든 화풍을 같은 장면으로 그려 비교하기 쉽게 했어요.") +
    `<div class="panel"><div class="row"><h2 class="grow" style="margin:0">화풍 <span class="tiny dim">${state.cfg.styles.length}종 · 예시 그림 ${state.cfg.styles.length - missing.length}/${state.cfg.styles.length}</span></h2>
      ${canAuto ? `${missing.length ? `<button class="sm" onclick='runStep("style_examples",{ids:${JSON.stringify(missing)}})'>빈 예시 그림 만들기 (${missing.length}장, 약 ${missing.length * 60}원)</button>` : ""}
      <button class="sm ghost" onclick="if(confirm('예시 그림을 모두 새로 만들까요?'))runStep('style_examples',{})">예시 다시 만들기</button>` : ""}</div>
    ${canAuto ? "" : `<div class="hint">키가 없으면 카드의 ✎로 예시 프롬프트를 복사해 Gemini 앱 등에서 그림을 만든 뒤, 카드에 끌어다 놓으세요. 한 번 만들어 두면 모든 프로젝트에서 써요.</div>`}
    ${groups.map(g => `<h3 style="margin-top:14px">${g}</h3><div class="cards">${state.cfg.styles.filter(s => s.group === g).map(s => `<div class="card style-card vc" style="padding:0" data-style="${s.id}" aria-selected="${st.id === s.id && !st.custom}" onclick="pickStyle('${s.id}')">
      <div class="th" style="background-image:${ex[s.id] ? `url('/files/_styles/${ex[s.id]}&token=${TOKEN}')` : `linear-gradient(135deg,${STYLE_BG[s.id] || "#334155,#0f172a"})`}">${ex[s.id] ? "" : esc(s.name)}</div>
      <div class="bd"><div class="row" style="gap:4px"><b class="grow">${esc(s.name)}</b><button class="link sm" title="예시 프롬프트 복사" onclick="event.stopPropagation();copyStylePrompt('${s.id}')">✎</button><button class="link sm" title="예시 그림 올리기" onclick="event.stopPropagation();pickStyleImage('${s.id}')">올리기</button></div><div class="tiny dim">${esc(s.desc)}</div></div></div>`).join("")}</div>`).join("")}
    <label class="field" style="margin-top:14px"><span>직접 입력 화풍 (영어 권장, 쓰면 위 선택보다 우선)</span><input id="st_custom" value="${esc(st.custom)}" placeholder="예: soft pastel children's book illustration, crayon texture"></label>
    <label class="row" style="margin-top:10px"><input type="checkbox" id="st_ref" ${st.use_ref !== false ? "checked" : ""}> 고른 화풍의 예시 그림을 그림체 기준으로 함께 보내기 (Gemini 이미지, 그림체가 덜 흔들려요)</label>
    <label class="row" style="margin-top:6px"><input type="checkbox" id="st_text" ${st.allow_text ? "checked" : ""}> 그림 속 한글 허용 (간판·출석부·표지판 같은 글자를 한글로 그려요)</label></div>
    <div class="grid2"><div class="panel"><h2>등장인물</h2>
      <textarea id="st_char" rows="4" placeholder="예: Korean man in his 40s, short black hair, navy suit, round glasses (비워 두면 스토리보드에서 AI가 정해요)">${esc(st.character)}</textarea>
      <p class="tiny dim">실존 인물의 이름이나 얼굴을 쓰지 말고 외형만 묘사하세요.</p></div>
      <div class="panel"><h2>장면 길이</h2>
      <label class="field"><span>한 장면 평균 <b id="secv">${st.scene_seconds}초</b> → 약 <b id="cntv">${cnt(st.scene_seconds)}</b>컷</span><input type="range" id="st_sec" min="3" max="120" step="1" value="${st.scene_seconds}"></label>
      <div class="row tiny" style="margin-top:6px">빠른 선택: ${[[6, "빠른 전개"], [10, "보통"], [30, "차분"], [65, "이슈 해설형 (25분에 약 23장)"]].map(([v, n]) => `<button class="sm ghost" onclick="setSceneSec(${v})">${n}</button>`).join("")}</div>

    <input type="file" id="st_file" hidden accept="image/*">
    <div class="next"><button class="ghost" onclick="go('voice')">← 음성</button><button onclick="saveStyle(true)">다음: 스토리보드 →</button></div>`;
  $("#st_sec").oninput = e => { $("#secv").textContent = e.target.value + "초"; $("#cntv").textContent = cnt(+e.target.value); };
  ["#st_custom", "#st_char", "#st_sec", "#st_ref", "#st_text"].forEach(s => $(s).addEventListener("change", () => saveStyle(false)));

    c.ondragleave = () => c.style.outline = "";
    c.ondrop = e => { e.preventDefault(); c.style.outline = ""; const f = e.dataTransfer.files[0]; if (f) putStyleImage(c.dataset.style, f); };
  });
}
function setSceneSec(v) { $("#st_sec").value = v; $("#st_sec").dispatchEvent(new Event("input")); saveStyle(false); }
function copyStylePrompt(id) { return copyFrom(promptOf(`style:${id}`)); }
function pickStyleImage(id) { const inp = $("#st_file"); inp.onchange = () => inp.files[0] && putStyleImage(id, inp.files[0]); inp.value = ""; inp.click(); }
async function putStyleImage(id, f) { try { await upload(f, {kind: "style", style: id, token: TOKEN}); state.cfg = await api("/api/config"); viewStyle(); toast("예시 그림을 넣었어요"); } catch (e) { fail(e); } }
async function pickStyle(id) { $("#st_custom").value = ""; state.p.style.id = id; await saveStyle(false); viewStyle(); drawSteps(); }
async function saveStyle(next) {
  const st = {...state.p.style, custom: $("#st_custom").value, character: $("#st_char").value, scene_seconds: +$("#st_sec").value,
    use_ref: $("#st_ref").checked, allow_text: $("#st_text").checked, chosen: true};
  await save({style: st}, true);

  } catch (e) { return fail(e); }

}
function helperWatch() {

  const tick = async () => {
    if (state.view !== "image" || !$("#helper")) { helperPoll = null; return; }

function videoForm() {

async function saveVideoForm() { const f = videoForm(); const resChanged = f.video.resolution !== state.p.video.resolution; await save(f, true); if (resChanged) viewVideo(); }
function drawPreview() {
  const f = videoForm(), s = f.sub, pv = $("#pv"), el = $("#pv_sub");
  if (!pv) return;
  const hex = (c, a) => c + Math.round(a * 255).toString(16).padStart(2, "0");
  const vert = f.video.resolution === "1080x1920";
  // 영상에서 글자 높이 = 크기 × 3.2px (가로 1920 기준 높이 1080, 세로는 폭 1080 기준)
  el.style.fontSize = (s.size * 3.2 * 100 / (vert ? 1080 : 1920)) + "cqw";
  el.style.color = s.color;
  el.style.fontWeight = s.bold ? 800 : 500;
  el.style.fontFamily = `"${s.font_family}", "Malgun Gothic", sans-serif`;
  el.style.background = s.box ? hex(s.box_color, s.box_opacity) : "transparent";
  el.style.webkitTextStroke = s.box ? "0" : (s.outline * 0.6) + "px " + (s.outline_color || "#000");
  el.style.textShadow = s.box ? "none" : "0 0 3px #000";
  el.style.top = el.style.bottom = "";
  if (s.position === "bottom") el.style.bottom = (s.margin * 100) + "%"; else if (s.position === "top") el.style.top = (s.margin * 100) + "%"; else el.style.top = "45%";
  el.querySelectorAll(".acc").forEach(a => a.style.color = s.highlight_numbers ? s.accent : s.color);
  const lg = $("#pv_logo");
  if (lg) { lg.style.width = (f.video.logo_scale * 100) + "%"; lg.style.opacity = f.video.logo_opacity; const v = state.p.video;
    lg.style.left = `calc((100% - ${f.video.logo_scale * 100}%) * ${v.logo_x})`; lg.onload = () => { lg.style.top = `calc((100% - ${lg.offsetHeight}px) * ${v.logo_y})`; }; lg.onload(); }
}
function bindLogoDrag() {
  const lg = $("#pv_logo"), pv = $("#pv");
  if (!lg) return;
  lg.onpointerdown = e => {
    e.preventDefault(); lg.setPointerCapture(e.pointerId);
    const r = pv.getBoundingClientRect();
    lg.onpointermove = m => {
      const x = Math.min(1, Math.max(0, (m.clientX - r.left - lg.offsetWidth / 2) / (r.width - lg.offsetWidth)));
      const y = Math.min(1, Math.max(0, (m.clientY - r.top - lg.offsetHeight / 2) / (r.height - lg.offsetHeight)));
      state.p.video.logo_x = +x.toFixed(3); state.p.video.logo_y = +y.toFixed(3); drawPreview();
    };
    lg.onpointerup = () => { lg.onpointermove = null; saveVideoForm(); };
  };
}
function subPreset(i) {

}

function teDefaults(text, scene) {

  const gap = size * 1.15, top = TE_H - 60 - gap * lines.length + gap / 2;

    lines: lines.map((t, i) => ({text: t, size, color: i === lines.length - 1 && lines.length > 1 ? "#FFE400" : "#FFFFFF", x: TE_W / 2, y: top + gap * i, font: "", tilt: 0, box: ""}))};
}

async function teLoadFonts() {

  const c = cv.getContext("2d");
  c.clearRect(0, 0, TE_W, TE_H);
  if (te.img && te.img.complete && te.img.naturalWidth) {
    const r = Math.max(TE_W / te.img.naturalWidth, TE_H / te.img.naturalHeight);
    const w = te.img.naturalWidth * r, h = te.img.naturalHeight * r;
    c.filter = `brightness(${te.bright}%) contrast(108%) saturate(115%)`;
    c.drawImage(te.img, (TE_W - w) / 2, (TE_H - h) / 2, w, h);
    c.filter = "none";
  }
  if (te.shade) { const g = c.createLinearGradient(0, TE_H * 0.4, 0, TE_H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.6)"); c.fillStyle = g; c.fillRect(0, 0, TE_W, TE_H); }
  c.textAlign = "center"; c.textBaseline = "middle"; c.lineJoin = "round";
  te.lines.forEach((l, i) => {
    if (!l.text.trim()) return;
    const b = teBounds(c, l), w = b.w, h = b.h, yo = l.size * 0.05;
    c.save(); c.translate(l.x, l.y); c.rotate((l.tilt || 0) * Math.PI / 180);
    const shadowOn = () => { if (te.shadow) { c.shadowColor = "rgba(0,0,0,.6)"; c.shadowBlur = l.size * 0.12; c.shadowOffsetX = c.shadowOffsetY = l.size * 0.05; } };
    const shadowOff = () => { c.shadowColor = "transparent"; c.shadowBlur = c.shadowOffsetX = c.shadowOffsetY = 0; };
    shadowOn();
    if (l.box) { const pad = l.size * 0.18; c.fillStyle = l.box; c.beginPath(); c.roundRect ? c.roundRect(-w / 2 - pad, -h / 2 - pad * 0.6, w + pad * 2, h + pad * 1.2, l.size * 0.08) : c.rect(-w / 2 - pad, -h / 2 - pad * 0.6, w + pad * 2, h + pad * 1.2); c.fill(); shadowOff(); }
    const lw = te.outline * 2 * l.size / 130;
    if (te.outline2 && te.outline) { c.strokeStyle = "#FFFFFF"; c.lineWidth = lw + l.size * 0.14; c.strokeText(l.text, 0, yo); shadowOff(); }
    if (te.outline) { c.strokeStyle = te.outlineColor; c.lineWidth = lw; c.strokeText(l.text, 0, yo); shadowOff(); }
    c.fillStyle = l.color; c.fillText(l.text, 0, yo);
    c.restore();
    if (!target && te.drag === i) { c.strokeStyle = "rgba(79,140,255,.9)"; c.lineWidth = 3; c.setLineDash([10, 6]); c.strokeRect(b.x - 8, b.y - 8, b.w + 16, b.h + 16); c.setLineDash([]); }
  });
}
function teDragSetup(cv) {
  const pt = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * TE_W / r.width, y: (e.clientY - r.top) * TE_H / r.height}; };
  let off = null;
  cv.onpointerdown = e => {
    const p = pt(e), c = cv.getContext("2d");
    for (let i = te.lines.length - 1; i >= 0; i--) {
      const b = teBounds(c, te.lines[i]);
      if (p.x >= b.x - 12 && p.x <= b.x + b.w + 12 && p.y >= b.y - 12 && p.y <= b.y + b.h + 12) {
        te.drag = i; off = {x: p.x - te.lines[i].x, y: p.y - te.lines[i].y}; cv.setPointerCapture(e.pointerId); teDraw(); return;
      }
    }
  };
  cv.onpointermove = e => {
    if (te.drag == null || !off) return;
    const p = pt(e), l = te.lines[te.drag];
    l.x = Math.round(p.x - off.x); l.y = Math.round(p.y - off.y);
    if (Math.abs(l.x - TE_W / 2) < 14) l.x = TE_W / 2;  // 가운데 근처면 딱 맞춤
    teDraw();
  };
  cv.onpointerup = () => { off = null; te.drag = null; teDraw(); };
}
async function teSave() {
  const cv = document.createElement("canvas"); cv.width = TE_W; cv.height = TE_H;
  te.drag = null; teDraw(cv);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
  try {
    const r = await fetch(`/api/upload?kind=thumb&id=${state.pid}`, {method: "POST", headers: {"X-Token": TOKEN, "X-Filename": "thumb.jpg"}, body: blob});
    if (!r.ok) throw new Error((await r.json()).error || "저장 실패");
    const keep = {scene: te.scene, outline: te.outline, outlineColor: te.outlineColor, outline2: !!te.outline2, shadow: !!te.shadow, shade: te.shade, bright: te.bright, lines: te.lines};
    await save({thumb_edit: keep}, true);
    $("#dlg").close(); $("#dlg").style.width = ""; await loadProject(); render(); toast("썸네일을 저장했어요 (1번)");
  } catch (e) { fail(e); }
}
